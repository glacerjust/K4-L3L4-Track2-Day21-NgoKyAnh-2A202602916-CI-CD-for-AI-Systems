name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          CREDS: ${{ secrets.STORAGE_CREDENTIALS }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REG: ${{ secrets.AWS_REGION }}
        run: |
          python - <<'PYEOF'
          import json, os
          creds_str = os.environ.get("CREDS", "").strip()
          aws_key = os.environ.get("AWS_KEY", "").strip()
          aws_sec = os.environ.get("AWS_SEC", "").strip()
          aws_reg = os.environ.get("AWS_REG", "").strip() or "us-east-1"
          
          env_file = os.environ.get("GITHUB_ENV")
          with open(env_file, "a") as f:
              if aws_key and aws_sec:
                  f.write(f"AWS_ACCESS_KEY_ID={aws_key}\n")
                  f.write(f"AWS_SECRET_ACCESS_KEY={aws_sec}\n")
                  f.write(f"AWS_DEFAULT_REGION={aws_reg}\n")
              elif creds_str.startswith("{"):
                  try:
                      data = json.loads(creds_str)
                      if "aws_access_key_id" in data:
                          f.write(f"AWS_ACCESS_KEY_ID={data['aws_access_key_id']}\n")
                          f.write(f"AWS_SECRET_ACCESS_KEY={data['aws_secret_access_key']}\n")
                          region = data.get("aws_region", "us-east-1")
                          f.write(f"AWS_DEFAULT_REGION={region}\n")
                  except Exception as e:
                      print(f"Error parsing AWS credentials: {e}")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
          print(f"Model successfully uploaded to s3://{bucket_name}/artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
